<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 707" width="1000" height="707">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="50%" stop-color="#fdfbf4"/>
      <stop offset="100%" stop-color="#faf5e8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b4d"/>
      <stop offset="100%" stop-color="#0f4c81"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="707" fill="url(#bgGrad)"/>

  <!-- Outer Navy Frame -->
  <rect x="20" y="20" width="960" height="667" rx="6" fill="none" stroke="url(#navyGrad)" stroke-width="16"/>

  <!-- Gold Accent Inner Border -->
  <rect x="42" y="42" width="916" height="623" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 4"/>

  <!-- Thin Inner Pinstripe -->
  <rect x="52" y="52" width="896" height="603" fill="none" stroke="#0f4c81" stroke-width="1" opacity="0.4"/>

  <!-- Elegant Corner Flourishes -->
  <!-- Top Left -->
  <path d="M 52 110 L 52 52 L 110 52" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="52" cy="52" r="6" fill="#b8860b"/>
  <!-- Top Right -->
  <path d="M 948 110 L 948 52 L 890 52" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="948" cy="52" r="6" fill="#b8860b"/>
  <!-- Bottom Left -->
  <path d="M 52 597 L 52 655 L 110 655" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="52" cy="655" r="6" fill="#b8860b"/>
  <!-- Bottom Right -->
  <path d="M 948 597 L 948 655 L 890 655" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="948" cy="655" r="6" fill="#b8860b"/>

  <!-- Center Academy Crest Header -->
  <g transform="translate(500, 115)">
    <!-- Shield / Seal -->
    <path d="M 0 -45 L 28 -28 L 28 12 C 28 32 0 45 0 45 C 0 45 -28 32 -28 12 L -28 -28 Z" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M -12 -5 L 0 -18 L 12 -5 L 0 8 Z" fill="url(#goldGrad)"/>
    <text x="0" y="70" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="900" fill="#0f4c81" text-anchor="middle" letter-spacing="4">COMPUTERSCIENCE.LK</text>
    <text x="0" y="90" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="3">ACADEMY OF ADVANCED COMPUTING &amp; IT MASTERY</text>
    <text x="0" y="140" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="800" fill="#0f4c81" text-anchor="middle" letter-spacing="6">CERTIFICATE OF COMPLETION</text>
    <text x="0" y="165" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">THIS CREDENTIAL IS PROUDLY AWARDED TO</text>
  </g>

  <!-- Watermark in Center Background -->
  <circle cx="500" cy="380" r="140" fill="none" stroke="#0f4c81" stroke-width="1" opacity="0.04"/>
  <circle cx="500" cy="380" r="110" fill="none" stroke="#b8860b" stroke-width="1" stroke-dasharray="6 6" opacity="0.06"/>

  <!-- Decorative Gold Seal in Bottom Center -->
  <g transform="translate(500, 580)">
    <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" opacity="0.15" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="0" y="-6" font-family="'Cinzel', serif" font-size="8" font-weight="900" fill="#b8860b" text-anchor="middle" letter-spacing="1">OFFICIAL</text>
    <text x="0" y="8" font-family="'Cinzel', serif" font-size="10" font-weight="900" fill="#0f4c81" text-anchor="middle" letter-spacing="2">VERIFIED</text>
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="6" font-weight="700" fill="#b8860b" text-anchor="middle" letter-spacing="1">CREDENTIAL</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="120" y1="520" x2="880" y2="520" stroke="#0f4c81" stroke-width="1" opacity="0.15"/>
</svg>
